<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp AI Agent — simulator</title>
<style>
  :root{
    --bg:#0b141a; --panel:#111b21; --mine:#005c4b; --theirs:#202c33;
    --text:#e9edef; --muted:#8696a0; --accent:#00a884;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#e5ddd5; --panel:#f0f2f5; --mine:#d9fdd3; --theirs:#ffffff;
      --text:#111b21; --muted:#667781; --accent:#008069;
    }
  }
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
  .phone{max-width:460px;margin:24px auto;border-radius:16px;overflow:hidden;
         box-shadow:0 8px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;height:calc(100vh - 48px)}
  header{background:var(--accent);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
  header .avatar{width:36px;height:36px;border-radius:50%;background:#fff3;display:grid;place-items:center;font-size:18px}
  header small{display:block;opacity:.85;font-weight:400}
  #chat{flex:1;overflow-y:auto;padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
  .msg{max-width:80%;padding:8px 12px;border-radius:10px;white-space:pre-wrap;line-height:1.35;font-size:14.5px}
  .me{align-self:flex-end;background:var(--mine)}
  .bot{align-self:flex-start;background:var(--theirs)}
  .typing{align-self:flex-start;color:var(--muted);font-size:13px;padding:4px 12px}
  form{display:flex;gap:8px;padding:10px;background:var(--panel)}
  input{flex:1;border:none;border-radius:20px;padding:11px 14px;font-size:15px;background:var(--bg);color:var(--text);outline:none}
  button{border:none;border-radius:50%;width:44px;height:44px;background:var(--accent);color:#fff;font-size:18px;cursor:pointer}
  .note{text-align:center;color:var(--muted);font-size:12px;margin:4px 16px}
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="avatar">💈</div>
    <div><strong>Fade Factory</strong><small>AI assistant · simulator</small></div>
  </header>
  <div id="chat"><div class="note">Local simulator: same agent, no WhatsApp account needed.<br>Try "what services do you offer?" or "book me a haircut tomorrow at 10".</div></div>
  <form id="f">
    <input id="t" placeholder="Type a message" autocomplete="off" autofocus>
    <button type="submit">➤</button>
  </form>
</div>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('f');
const input = document.getElementById('t');
const phone = 'sim-' + (localStorage.getItem('sim-phone') || (()=>{const p=String(Math.floor(Math.random()*1e8)); try{localStorage.setItem('sim-phone',p)}catch(e){}; return p})());

function whatsappHtml(text){
  const esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc.replace(/\*([^*\n]+)\*/g, '<b>$1</b>').replace(/_([^_\n]+)_/g, '<i>$1</i>');
}

function add(cls, text){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = whatsappHtml(text);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || input.disabled) return;
  input.value = '';
  input.disabled = true;
  add('me', text);
  const typing = document.createElement('div');
  typing.className = 'typing'; typing.textContent = 'typing…';
  chat.appendChild(typing); chat.scrollTop = chat.scrollHeight;
  try {
    const r = await fetch('/sim/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({phone, text})
    });
    const data = await r.json();
    typing.remove();
    add('bot', r.ok ? data.reply : ('⚠️ ' + (data.detail || 'Server error')));
  } catch {
    typing.remove();
    add('bot', '⚠️ Could not reach the server.');
  } finally {
    input.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
